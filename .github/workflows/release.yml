# Verify a tag, build the distributions, and add them to the AceMQ package index.
#
# Triggered by a tag:  git tag v0.2.1 && git push origin v0.2.1
#
# # Where this publishes, and why not PyPI
#
# The wheel and sdist go to AceMQ-Company/pypi, a static PEP 503 index served at
# https://acemq.org/pypi/, alongside the Maven repository, the NuGet feed and
# the gem feed that already work this way. They do not go to PyPI.
#
# That is deliberate and it is about reversibility. A project name on PyPI is
# permanent and a released version can never be re-uploaded — deleting a release
# does not free its filename, and yanking hides it from resolution while leaving
# every lockfile that already names it working. Publishing here first means a
# release can be corrected by deleting a file and re-indexing, which is the
# property worth having while the library is pre-1.0. Moving to PyPI later
# changes nothing for consumers except the index URL.
#
# # Publishing credentials
#
# PYPI_REPO_DEPLOY_KEY: an SSH deploy key with write access to
# AceMQ-Company/pypi and to nothing else in the organisation. A deploy key
# rather than a token because a token carries its owner's reach across every
# repository they can see, and this job needs exactly one.
#
# # No notification
#
# This workflow tells nobody. A release that is not on a public index is not
# news to announce, and the run itself is the record.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.1.1)'
        required: true

# Least privilege for every job that does not ask for more. The publish job
# declares `id-token: write` itself, so the one privilege that can put something
# on PyPI is reviewable in the file rather than inherited from an organisation
# setting somebody can change later.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floor the type hints are written against, not the newest.
          # Releasing something that only builds on a newer interpreter would
          # break the promise requires-python makes.
          python-version: '3.10'

      - name: Work out the version
        id: version
        env:
          # Through the environment rather than interpolated into the script. A
          # tag name and a dispatch input are both caller-controlled text, and
          # inlining either one lets whoever writes it run shell here.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${TAG_NAME#v}"
          fi
          # An allow-list, not a deny-list. The version reaches a file name, a
          # commit message and a package version, so anything that is not
          # plainly a version number is refused rather than escaped.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([ab]|rc)?[0-9]*$'; then
            echo "::error::not a release version: '$VERSION'"
            exit 1
          fi
          # The line stays on 0.1.x until that is deliberately changed. Without
          # this a mistyped tag ships a 0.2.0 or a 1.0.0, and a version on PyPI
          # cannot be withdrawn -- yanking hides it from resolution and leaves
          # every lockfile that already names it working. Lift this when the
          # line moves on.
          case "$VERSION" in
            0.3.*) ;;
            *)
              echo "::error::this library releases 0.3.x only; '$VERSION' needs the guard in release.yml lifted first"
              exit 1
              ;;
          esac
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "releasing $VERSION"

      - name: Check the package agrees with the tag
        # Two places say what version this is, and a release that disagrees with
        # either of them ships a wheel whose metadata names something else --
        # which a consumer only finds out from `pip show` telling them they have
        # a version nobody released.
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          declared=$(grep -E '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::pyproject.toml says $declared; the tag is $VERSION"
            exit 1
          fi
          reported=$(grep -E '^__version__ = ' src/acemq_amqp/__init__.py | cut -d'"' -f2)
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::acemq_amqp.__version__ is \"$reported\"; the tag is $VERSION"
            exit 1
          fi
          echo "pyproject.toml and __version__ both say $VERSION"

      - name: Install
        run: pip install -e ".[dev]" build twine

      - name: Test
        # Not the integration tests: they need a broker, and they have a job.
        run: pytest -m "not integration" -q

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      - name: Build the sdist and the wheel
        # Both. A wheel alone leaves anyone on a platform or a Python it was not
        # built for with nothing to fall back on, and an sdist alone makes every
        # install a build.
        run: python -m build --sdist --wheel --outdir "$RUNNER_TEMP/dist"

      - name: Check what will be uploaded
        # twine's own metadata check, run before the upload rather than
        # discovering at upload time that PyPI will not render the README --
        # which is a permanent version spent on a formatting mistake.
        run: twine check --strict "$RUNNER_TEMP"/dist/*

      - name: Check the sdist really builds the library
        # An sdist that is missing a file installs cleanly and fails on import,
        # and hatchling's file selection is configuration rather than a
        # guarantee. Installed from the sdist alone, into an interpreter that
        # has never seen this checkout.
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python -m venv "$RUNNER_TEMP/sdist-check"
          "$RUNNER_TEMP/sdist-check/bin/pip" install --quiet \
            "$RUNNER_TEMP/dist/acemq_amqp-$VERSION.tar.gz"
          "$RUNNER_TEMP/sdist-check/bin/python" -c "
          import acemq_amqp
          assert acemq_amqp.__version__ == '$VERSION', acemq_amqp.__version__
          # The contract layer has no dependencies, and this proves it: nothing
          # but the sdist went into this interpreter.
          acemq_amqp.Topology().queue('orders.new', dead_letter=True).validate()
          print('the sdist installs and imports')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest

    # A release runs the integration suite. It is the one moment where waiting
    # for the slow tests is obviously worth it: this is the artifact people
    # depend on.
    services:
      broker:
        image: rabbitmq:4-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test against the broker
        env:
          ACEMQ_TEST_BROKER: amqp://guest:guest@localhost:5672/
        run: |
          set -o pipefail
          pytest -m integration -q -rs 2>&1 | tee "$RUNNER_TEMP/broker-tests.log"

      - name: Check the broker tests really ran
        # A suite that skipped everything reports the same green as one that
        # passed everything. The TLS tests skip by design without a TLS broker;
        # anything else skipping during a release is a test that was meant to
        # check this artifact and did not.
        run: |
          log="$RUNNER_TEMP/broker-tests.log"
          # Not `sed 's/.*[^0-9]\([0-9]\+\) passed.*/\1/p'`, which is what this
          # was and which never matched anything: it requires a non-digit before
          # the count, and pytest -q opens its summary with the number, at
          # column one. The guard reported 0 for a run that passed 26 and failed
          # the release on it.
          passed=$(grep -oE '[0-9]+ passed' "$log" | head -1 | grep -oE '[0-9]+')
          passed=${passed:-0}
          if [ "$passed" -lt 20 ]; then
            echo "::error::only $passed broker tests passed; expected at least 20"
            exit 1
          fi
          echo "$passed broker tests passed"

  publish:
    needs: [verify, integration]
    # Tags only. A manual dispatch runs the checks against a branch and stops
    # short of publishing, which is what makes this workflow safe to try out.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi-feed
      url: https://acemq.org/pypi/

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - name: Check out the package index
        uses: actions/checkout@v4
        with:
          repository: AceMQ-Company/pypi
          # A deploy key rather than a token: write access to that repository
          # alone, and to nothing else in the organisation.
          ssh-key: ${{ secrets.PYPI_REPO_DEPLOY_KEY }}
          path: package-index

      - name: Add the distributions to it
        # Cloned first, then added to, so the index is regenerated over
        # everything already published. Building it from this release alone
        # would leave earlier versions on disk and invisible to pip.
        working-directory: package-index
        run: ./scripts/publish.sh "$GITHUB_WORKSPACE"/dist/*

      # `published` is the line between "nothing happened" and "something is out
      # there". Everything before this leaves the index untouched; everything
      # after operates on a version pip can already resolve.
      - name: Commit and push
        working-directory: package-index
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          git config user.name "acemq-release"
          git config user.email "noreply@acemq.org"
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to publish; $VERSION may already be in the index"
            exit 0
          fi
          git add -A
          git commit -m "Publish acemq-amqp $VERSION"
          git push origin HEAD

      - name: Install it back out of the index
        # The index is only real if pip can resolve from it. GitHub Pages takes
        # a moment to serve a new commit, so this retries rather than racing the
        # deploy.
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/verify"
          for attempt in $(seq 1 20); do
            if "$RUNNER_TEMP/verify/bin/pip" install --quiet --no-deps \
                 --index-url https://acemq.org/pypi/simple/ \
                 "acemq-amqp==$VERSION" 2>/dev/null; then
              "$RUNNER_TEMP/verify/bin/python" -c \
                "import acemq_amqp, sys; sys.exit(0 if acemq_amqp.__version__ == '$VERSION' else 1)"
              echo "installed acemq-amqp $VERSION from the index"
              exit 0
            fi
            sleep 15
          done
          echo "::error::the index did not serve acemq-amqp $VERSION within five minutes"
          exit 1
