# Announces a version that is already out, on request. release.yml's notify job
# announces every tagged release; this is for one it missed. It cannot run on
# `release: published`: releases are created with GITHUB_TOKEN, which starts
# no workflow.
name: release-notify

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to announce, for example v0.7.8'
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    uses: AceMQ-Company/acemq-java-amqp/.github/workflows/slack-notify.yml@main
    with:
      status: success
      title: AceMQ for Python ${{ inputs.tag }} released
      message: On the acemq.org feed. Consumers need no credentials.
      icon: ':white_check_mark:'
      url: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }}
    secrets: inherit
