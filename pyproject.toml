[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acemq-amqp"
version = "0.3.0"
description = "AceMQ messaging over AMQP for Python, speaking the same wire contract as the Java, Go and .NET libraries"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "AceMQ" }]
keywords = ["amqp", "rabbitmq", "messaging", "acemq"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]

# The contract layer has no dependencies at all: headers, retry arithmetic and
# naming are pure Python, and a project that only wants to read an AceMQ
# envelope should not be made to install a broker client to do it. The
# transport arrives as an extra.
dependencies = []

[project.optional-dependencies]
rabbitmq = ["aio-pika>=9.4"]
# The library calls its own Observer interface and depends on no metrics
# client. This extra is one adapter for it; telemetry.prometheus_text renders
# the same format with nothing installed at all.
prometheus = ["prometheus-client>=0.20"]
# patterns.sql imports no driver at all: it is written against the DB-API 2.0
# protocols, so sqlite3 from the standard library works with nothing installed
# and psycopg works if you have it. This extra is a convenience for a project
# that has not chosen a PostgreSQL driver yet, not something the code needs.
postgres = ["psycopg[binary]>=3.1"]
# The five formats Java and Go ship as separate optional modules, so a message
# from either can be read here. One extra each rather than one for all five: a
# service that speaks YAML has no reason to install a protobuf runtime, and the
# whole argument for keeping the core dependency-free is lost if the codecs
# arrive in a bundle. There is deliberately no [xml] extra — that codec is
# written against xml.etree and xml.parsers.expat and there would be nothing in
# it. See docs/serialization.md.
yaml = ["PyYAML>=6.0"]
# tomllib reads TOML from 3.11 on; tomli is the same parser under its original
# name, for 3.10. Neither writes, and the standard library has no writer at all.
toml = ["tomli-w>=1.0", "tomli>=2.0; python_version < '3.11'"]
protobuf = ["protobuf>=4.25"]
avro = ["fastavro>=1.9"]
# AES-GCM for codecs.encrypted, and X.509 for devcerts. Both are cryptography's
# whole reason to exist and neither is in the standard library: hashlib and hmac
# are there, an authenticated cipher and a certificate builder are not. One
# extra rather than two, because it is one dependency either way and a project
# that has it installed has both.
crypto = ["cryptography>=42.0"]
# The tracing adapter is written against the OpenTelemetry *API* alone, which is
# the package a library is supposed to depend on: it is inert until an
# application installs an SDK and configures it, so importing this cannot start
# exporting anything an application did not ask for.
opentelemetry = ["opentelemetry-api>=1.20"]
dev = [
  "aio-pika>=9.4",
  "cryptography>=42.0",
  "fastavro>=1.9",
  "mypy>=1.11",
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
  # Pinned, so a new pdoc cannot change the published API reference without
  # somebody choosing it. The docs workflow installs the same version.
  "pdoc==15.0.1",
  "prometheus-client>=0.20",
  "protobuf>=4.25",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "PyYAML>=6.0",
  "ruff>=0.6",
  "tomli-w>=1.0",
  "tomli>=2.0; python_version < '3.11'",
  "types-protobuf",
  "types-PyYAML",
]

[project.urls]
Homepage = "https://acemq.org"
Source = "https://github.com/AceMQ-Company/acemq-python-amqp"
Issues = "https://github.com/AceMQ-Company/acemq-python-amqp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/acemq_amqp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a broker and are marked, so `pytest` on a laptop with
# no Docker runs everything that does not.
markers = ["integration: needs a running broker"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
